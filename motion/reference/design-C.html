<!doctype html>
<!--
  MUNTABIQ · "من 10 جداول إلى شاشة وحدة" · design C, v4 (approved still)
  Plain Royal Green background (no pattern). The 10 Excel-style sheets merge into the
  real MUNTABIQ dashboard, which then comes to the front, face-on: this still is the end.
  Source of truth for layout, sizes, colours and the CSS 3D isometric stack.
  Brand: SecureLogX Brand v3. Canvas 1080 × 1350.
-->
<html lang="ar">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "Almarai"; font-weight: 400; src: url("fonts/Almarai-400.ttf"); }
  @font-face { font-family: "Almarai"; font-weight: 700; src: url("fonts/Almarai-700.ttf"); }
  @font-face { font-family: "Almarai"; font-weight: 800; src: url("fonts/Almarai-800.ttf"); }
  @font-face { font-family: "Barlow Condensed"; font-weight: 700; src: url("fonts/BarlowCondensed-700.ttf"); }

  html, body { margin: 0; padding: 0; background: #06572D; }
  .canvas { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #06572D; }

  /* plain Royal Green panel */

  /* soft green glow behind the dashboard */
  .glow {
    position: absolute; left: 0px; top: 300px; width: 1080px; height: 480px;
    background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(10,163,84,0.6), rgba(10,163,84,0) 70%);
  }

  /* the real dashboard, face-on, at the front */
  .front {
    position: absolute; left: 60px; top: 300px; width: 960px; height: 475px; box-sizing: border-box;
    border: 3px solid #ffffff; box-shadow: 0 30px 60px rgba(0,0,0,0.35); background: #ffffff;
  }
  .front img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; display: block; }

  .tag {
    position: absolute; left: 72px; top: 84px; padding: 8px 22px 10px 18px;
    background: #CCB58B; color: #262626; direction: rtl;
    font: 800 26px/1.2 "Almarai";
    clip-path: polygon(0 0, 100% 0, 100% 100%, 14px 100%, 0 calc(100% - 14px));
  }
  .logo { position: absolute; top: 64px; right: 72px; height: 80px; }


  .headline { position: absolute; right: 72px; top: 930px; direction: rtl; text-align: right; color: #ffffff; font: 800 76px/1.25 "Almarai"; }
  .rule { position: absolute; right: 72px; top: 1132px; width: 180px; height: 6px; background: #ffffff; }
  .sub { position: absolute; right: 72px; top: 1162px; direction: rtl; text-align: right; color: #ffffff; font: 400 30px/1.4 "Almarai"; }

  .byline { position: absolute; right: 72px; bottom: 64px; display: flex; flex-direction: row; align-items: center; gap: 16px; direction: rtl; }
  .byline span { color: #ffffff; font: 700 22px/1 "Almarai"; }
  .byline img { height: 24px; width: auto; display: block; }

  .corner { position: absolute; left: 0; bottom: 0; width: 150px; height: 150px; background: #087D40; clip-path: polygon(0 0, 0 100%, 100% 100%); }
</style>
</head>
<body>
<div class="canvas">
  <div class="glow"></div>

  <div class="front"><img src="../public/muntabiq-dashboard.png" alt="MUNTABIQ dashboard" /></div>

  <div class="tag">قبل / بعد</div>
  <img class="logo" src="../public/muntabiq-logo.png" alt="" onerror="this.style.display='none'" />


  <div class="headline">من 10 جداول<br />إلى شاشة وحدة</div>
  <div class="rule"></div>
  <div class="sub">الالتزام في عرض واحد مباشر، لكل القطاعات.</div>

  <div class="byline"><span>منصة من</span><img src="../public/securelogx-wordmark-white.png" alt="SecureLogX" /></div>
  <div class="corner"></div>
</div>
</body>
</html>
