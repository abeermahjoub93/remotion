<!doctype html>
<!--
  MUNTABIQ · "من 10 جداول إلى شاشة وحدة" · design C (approved still)
  Source of truth for layout, sizes, colours and the CSS 3D isometric stack.
  Brand: SecureLogX Brand v3. Canvas 1080 × 1350.
-->
<html lang="ar">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "Almarai"; font-weight: 400; src: url("fonts/Almarai-400.ttf"); }
  @font-face { font-family: "Almarai"; font-weight: 700; src: url("fonts/Almarai-700.ttf"); }
  @font-face { font-family: "Almarai"; font-weight: 800; src: url("fonts/Almarai-800.ttf"); }
  @font-face { font-family: "Barlow Condensed"; font-weight: 700; src: url("fonts/BarlowCondensed-700.ttf"); }

  html, body { margin: 0; padding: 0; background: #262626; }
  .canvas { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #262626; }

  .pattern {
    position: absolute; inset: 0;
    background-image: url("../public/brand-pattern-blur.png");
    background-size: 1300px auto; background-repeat: repeat; background-position: 0px 0px;
    opacity: 0.22;
  }

  /* soft green glow under the base plane */
  .glow {
    position: absolute; left: 190px; top: 560px; width: 700px; height: 400px;
    background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(8,125,64,0.55), rgba(8,125,64,0) 70%);
  }

  /* isometric stack: 340 × 340 planes centred at (540, 700), no perspective */
  .stack {
    position: absolute; left: 370px; top: 530px; width: 340px; height: 340px;
    transform-style: preserve-3d; transform: rotateX(58deg) rotateZ(45deg);
  }
  .plane { position: absolute; left: 0; top: 0; width: 340px; height: 340px; box-sizing: border-box; }
  .edge { background: #06572D; transform: translateZ(-14px); }
  .base { background: #087D40; border: 2px solid #0aa354; }
  .bar { position: absolute; background: #ffffff; }
  .tile { position: absolute; width: 138px; height: 116px; background: rgba(255,255,255,0.12); }
  .sheet {
    border: 2px solid rgba(255,255,255,0.85);
    background-image:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.22) 0 1px, transparent 1px 56px),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.22) 0 1px, transparent 1px 113px);
  }

  .tag {
    position: absolute; left: 72px; top: 84px; padding: 8px 22px 10px 18px;
    background: #CCB58B; color: #262626; direction: rtl;
    font: 800 26px/1.2 "Almarai";
    clip-path: polygon(0 0, 100% 0, 100% 100%, 14px 100%, 0 calc(100% - 14px));
  }
  .logo { position: absolute; top: 64px; right: 72px; height: 80px; }

  .label { position: absolute; width: 190px; text-align: right; direction: rtl; color: #ffffff; }
  .label .num { font: 700 120px/1 "Barlow Condensed"; direction: ltr; }
  .label .txt { margin-top: 4px; font: 700 30px/1.3 "Almarai"; }
  .pointer { position: absolute; left: 0; top: 0; }

  .headline { position: absolute; right: 72px; top: 930px; direction: rtl; text-align: right; color: #ffffff; font: 800 76px/1.25 "Almarai"; }
  .rule { position: absolute; right: 72px; top: 1132px; width: 180px; height: 6px; background: #087D40; }
  .sub { position: absolute; right: 72px; top: 1162px; direction: rtl; text-align: right; color: #ffffff; font: 400 30px/1.4 "Almarai"; }

  .byline { position: absolute; right: 72px; bottom: 64px; display: flex; flex-direction: row; align-items: center; gap: 16px; direction: rtl; }
  .byline span { color: #ffffff; font: 700 22px/1 "Almarai"; }
  .byline img { height: 24px; width: auto; display: block; }

  .corner { position: absolute; left: 0; bottom: 0; width: 150px; height: 150px; background: #087D40; clip-path: polygon(0 0, 0 100%, 100% 100%); }
</style>
</head>
<body>
<div class="canvas">
  <div class="pattern"></div>
  <div class="glow"></div>

  <div class="stack">
    <div class="plane edge"></div>
    <div class="plane base">
      <div class="bar" style="left:24px; top:24px; width:292px; height:26px;"></div>
      <div class="tile" style="left:24px; top:70px;"><div class="bar" style="right:14px; bottom:16px; width:96px; height:14px;"></div></div>
      <div class="tile" style="left:178px; top:70px;"><div class="bar" style="right:14px; bottom:16px; width:70px; height:14px;"></div></div>
      <div class="tile" style="left:24px; top:200px;"><div class="bar" style="right:14px; bottom:16px; width:108px; height:14px;"></div></div>
      <div class="tile" style="left:178px; top:200px;"><div class="bar" style="right:14px; bottom:16px; width:56px; height:14px;"></div></div>
    </div>
    <!-- 10 sheets, bottom → top: translate3d(x, y, z) rotateZ(r), opacity o -->
    <div class="plane sheet" style="transform: translate3d(0px, 0px, 24px) rotateZ(0deg); opacity: 0.94;"></div>
    <div class="plane sheet" style="transform: translate3d(2px, -2px, 46px) rotateZ(-0.6deg); opacity: 0.88;"></div>
    <div class="plane sheet" style="transform: translate3d(-3px, 3px, 70px) rotateZ(0.8deg); opacity: 0.82;"></div>
    <div class="plane sheet" style="transform: translate3d(4px, -4px, 96px) rotateZ(-1deg); opacity: 0.76;"></div>
    <div class="plane sheet" style="transform: translate3d(-5px, 5px, 124px) rotateZ(1.3deg); opacity: 0.7;"></div>
    <div class="plane sheet" style="transform: translate3d(7px, -6px, 154px) rotateZ(-1.6deg); opacity: 0.64;"></div>
    <div class="plane sheet" style="transform: translate3d(-8px, 8px, 186px) rotateZ(2deg); opacity: 0.58;"></div>
    <div class="plane sheet" style="transform: translate3d(10px, -9px, 220px) rotateZ(-2.3deg); opacity: 0.52;"></div>
    <div class="plane sheet" style="transform: translate3d(-12px, 11px, 256px) rotateZ(2.7deg); opacity: 0.46;"></div>
    <div class="plane sheet" style="transform: translate3d(14px, -13px, 294px) rotateZ(-3deg); opacity: 0.4;"></div>
  </div>

  <div class="tag">قبل / بعد</div>
  <img class="logo" src="../public/muntabiq-logo.png" alt="" onerror="this.style.display='none'" />

  <!-- labels + 45° pointers -->
  <div class="label" style="left: 72px; top: 330px;"><div class="num">10</div><div class="txt">جداول متفرقة</div></div>
  <svg class="pointer" width="1080" height="1350"><polyline points="270,400 302,400 336,434" fill="none" stroke="#ffffff" stroke-width="2" /></svg>
  <div class="label" style="left: 818px; top: 560px;"><div class="num">1</div><div class="txt">شاشة وحدة</div></div>
  <svg class="pointer" width="1080" height="1350"><polyline points="786,700 834,652 852,652" fill="none" stroke="#ffffff" stroke-width="2" /></svg>

  <div class="headline">من 10 جداول<br />إلى شاشة وحدة</div>
  <div class="rule"></div>
  <div class="sub">الالتزام في عرض واحد مباشر، لكل القطاعات.</div>

  <div class="byline"><span>منصة من</span><img src="../public/securelogx-wordmark-white.png" alt="SecureLogX" /></div>
  <div class="corner"></div>
</div>
</body>
</html>
